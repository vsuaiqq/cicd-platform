server:
  grpc_port: 50051
  http_port: 8082

jwt:
  access_token_ttl: 3600
  refresh_token_ttl: 604800

postgres:
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 300s
  conn_max_idle_time: 60s
  connect_timeout: 10s

redis:
  addr: "redis:6379"
  db: 0
  pool_size: 10
  min_idle_conns: 5
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  pool_timeout: 4s
  max_retries: 3
